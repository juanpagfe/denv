[package]
name = "copy"
version = "0.1.0"
edition = "2021"
description = "Self-contained clipboard manager: copy, paste, history, and interactive picker"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
dirs = "5"
crossterm = "0.28"
ctrlc = { version = "3", features = ["termination"] }
chrono = { version = "0.4", features = ["serde"] }
x11-clipboard = "0.9"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
