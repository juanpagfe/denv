[package]
name = "pack"
version = "0.1.0"
edition = "2021"
description = "Unified archive tool: create, extract, list, verify and inspect archives"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
tar = "0.4"
flate2 = "1"
zstd = "0.13"
xz2 = "0.1"
zip = "2"
indicatif = "0.17"
crossterm = "0.28"
ctrlc = { version = "3", features = ["termination"] }
dirs = "5"
bytesize = "1"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
strip = true
