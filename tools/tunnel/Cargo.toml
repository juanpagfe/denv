[package]
name = "tunnel"
version = "0.1.0"
edition = "2021"
description = "Unified tunnel manager: SSH forwarding, SOCKS proxy, and named tunnels"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
russh = "0.49"
russh-keys = "0.49"
ssh-key = "0.6"
async-trait = "0.1"
dirs = "5"
crossterm = "0.28"
ctrlc = { version = "3", features = ["termination"] }
chrono = "0.4"
libc = "0.2"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
strip = true
